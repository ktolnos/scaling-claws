<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" width="48" height="40">
  <!-- Building body -->
  <rect x="4" y="10" width="40" height="26" rx="1" fill="#2b3549" stroke="#4d6c98" stroke-width="0.8"/>
  <!-- Roof -->
  <rect x="2" y="8" width="44" height="4" rx="1" fill="#1b263a" stroke="#4d6c98" stroke-width="0.8"/>
  <!-- HVAC units on roof -->
  <rect x="8" y="4" width="8" height="5" rx="1" fill="#2b3549" stroke="#5f84bb" stroke-width="0.4"/>
  <rect x="20" y="5" width="6" height="4" rx="1" fill="#2b3549" stroke="#5f84bb" stroke-width="0.4"/>
  <!-- Fan spinning on HVAC -->
  <circle cx="12" cy="6.5" r="1.8" fill="none" stroke="#87afe8" stroke-width="0.5">
    <animateTransform attributeName="transform" type="rotate" values="0 12 6.5;360 12 6.5" dur="1s" repeatCount="indefinite"/>
  </circle>
  <line x1="12" y1="4.7" x2="12" y2="8.3" stroke="#87afe8" stroke-width="0.4">
    <animateTransform attributeName="transform" type="rotate" values="0 12 6.5;360 12 6.5" dur="1s" repeatCount="indefinite"/>
  </line>
  <!-- Windows (server room glow) -->
  <rect x="8" y="14" width="6" height="4" rx="0.5" fill="#0f1621" stroke="#355173" stroke-width="0.4"/>
  <rect x="17" y="14" width="6" height="4" rx="0.5" fill="#0f1621" stroke="#355173" stroke-width="0.4"/>
  <rect x="26" y="14" width="6" height="4" rx="0.5" fill="#67dfba" opacity="0.95">
    <animate attributeName="fill" values="#67dfba;#88f0cd;#67dfba" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="35" y="14" width="6" height="4" rx="0.5" fill="#0f1621" stroke="#355173" stroke-width="0.4"/>
  <!-- Loading dock door -->
  <rect x="18" y="24" width="12" height="12" rx="1" fill="#0f1621" stroke="#355173" stroke-width="0.5"/>
  <line x1="18" y1="27" x2="30" y2="27" stroke="#27384f" stroke-width="0.3"/>
  <line x1="18" y1="30" x2="30" y2="30" stroke="#27384f" stroke-width="0.3"/>
  <line x1="18" y1="33" x2="30" y2="33" stroke="#27384f" stroke-width="0.3"/>
  <!-- Side door -->
  <rect x="7" y="28" width="5" height="8" rx="0.5" fill="#0f1621" stroke="#355173" stroke-width="0.3"/>
  <!-- Status lights on building -->
  <circle cx="40" cy="13" r="1" fill="#67dfba" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Base trim -->
  <rect x="6" y="35.2" width="36" height="1.8" rx="0.9" fill="#23364f"/>
  <!-- Parking lines -->
  <line x1="34" y1="36.4" x2="34" y2="39.4" stroke="#42608a" stroke-width="0.3"/>
  <line x1="38" y1="36.4" x2="38" y2="39.4" stroke="#42608a" stroke-width="0.3"/>
  <line x1="42" y1="36.4" x2="42" y2="39.4" stroke="#42608a" stroke-width="0.3"/>
</svg>
